# Agent Approval Workflow - SonataFlow Configuration
# Deploy on OpenShift with the SonataFlow Operator

# Workflow ID
quarkus.rest-client."notifications_openapi_yaml".url=${NOTIFICATIONS_URL:http://backstage-backend.backstage.svc.cluster.local:7007}
quarkus.rest-client."augment_agent_lifecycle_yaml".url=${AUGMENT_BACKEND_URL:http://backstage-backend.backstage.svc.cluster.local:7007/api/augment}

# Knative Eventing - CloudEvent sink for emitting events
mp.messaging.outgoing.kogito_outgoing_stream.url=${K_SINK:http://broker-ingress.knative-eventing.svc.cluster.local/default/default}

# Auth: static RHDH token injected via workflow constants + OpenAPI header param.
# OIDC client is disabled — the workflow passes the token directly.
quarkus.oidc-client.enabled=false

# Correlation: CloudEvents must include kogitoprocrefid for instance matching
kogito.addon.events.process.kogitoprocrefid-enabled=true

# Approval timeout (overridable via secret)
# Default: 72 hours before escalation
agent.approval.timeout=PT72H

# Override dev-profile defaults: enable event publishing to Data Index
kogito.events.processdefinitions.enabled=true
kogito.events.processinstances.enabled=true
kogito.events.usertasks.enabled=true

mp.messaging.outgoing.kogito-processinstances-events.connector=quarkus-http
mp.messaging.outgoing.kogito-processinstances-events.url=${KOGITO_DATA_INDEX_URL:http://sonataflow-platform-data-index-service}/processes
mp.messaging.outgoing.kogito-processdefinitions-events.connector=quarkus-http
mp.messaging.outgoing.kogito-processdefinitions-events.url=${KOGITO_DATA_INDEX_URL:http://sonataflow-platform-data-index-service}/definitions
mp.messaging.outgoing.kogito-usertaskinstances-events.connector=quarkus-http
mp.messaging.outgoing.kogito-usertaskinstances-events.url=${KOGITO_DATA_INDEX_URL:http://sonataflow-platform-data-index-service}/usertasks

mp.messaging.outgoing.kogito-job-service-job-request-events.connector=quarkus-http
mp.messaging.outgoing.kogito-job-service-job-request-events.url=${KOGITO_JOBS_SERVICE_URL:http://sonataflow-platform-jobs-service}/v2/jobs/events
